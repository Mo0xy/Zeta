spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/zeta_users
    username: zeta
    password: zeta_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

jwt:
  # IMPORTANTE: In produzione bisogna usare una variabile d'ambiente o secret manager
  # Deve essere almeno 256 bit (32 caratteri) per HS256
  secret: ${JWT_SECRET:piattaforma-zeta-secret-key-deve-essere-molto-lunga-almeno-256-bit}

  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000} # 15 minuti

  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 giorni

  # Issuer del token
  issuer: ${JWT_ISSUER:piattaforma-zeta}

server:
  port: 8081

logging:
  level:
    root: INFO
    it.aruba.pec.zeta: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always